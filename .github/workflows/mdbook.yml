name: Deploy mdBook to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install mdBook
        run: |
          mkdir bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | tar -xz --directory=bin
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare clean book source
        run: |
          mkdir _book_source
          cp book.toml _book_source/
          # Copy every tracked top-level Markdown page, so adding a new page
          # never requires editing this workflow.
          git ls-files -z -- '*.md' ':!:*/*' | xargs -0 cp -t _book_source/
          cp -R assets theme _book_source/
      - name: Build
        run: |
          bin/mdbook build _book_source --dest-dir book
          rm book/book.toml
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
